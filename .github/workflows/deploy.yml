name: Test, build, and deploy frontend

on:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SIGNAL_FRONT_SSM_PREFIX: /signal-front/

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Lint and unit tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Record the last change of every page for the sitemap
        run: scripts/lastmod.sh > lastmod.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Read Vite origins from SSM
        id: config
        run: |
          set -euo pipefail
          api=$(aws ssm get-parameter --name "${SIGNAL_FRONT_SSM_PREFIX}VITE_API_BASE_URL" --query Parameter.Value --output text)
          agent=$(aws ssm get-parameter --name "${SIGNAL_FRONT_SSM_PREFIX}VITE_AGENT_API_BASE_URL" --query Parameter.Value --output text)
          echo "api_base_url=$api" >> "$GITHUB_OUTPUT"
          echo "agent_api_base_url=$agent" >> "$GITHUB_OUTPUT"
          auth0_domain=$(aws ssm get-parameter --name "${SIGNAL_FRONT_SSM_PREFIX}VITE_AUTH0_DOMAIN" --query Parameter.Value --output text 2>/dev/null || true)
          auth0_client_id=$(aws ssm get-parameter --name "${SIGNAL_FRONT_SSM_PREFIX}VITE_AUTH0_CLIENT_ID" --query Parameter.Value --output text 2>/dev/null || true)
          echo "auth0_domain=$auth0_domain" >> "$GITHUB_OUTPUT"
          echo "auth0_client_id=$auth0_client_id" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          load: true
          tags: boxlead-front:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ steps.config.outputs.api_base_url }}
            VITE_AGENT_API_BASE_URL=${{ steps.config.outputs.agent_api_base_url }}
            VITE_AUTH0_DOMAIN=${{ steps.config.outputs.auth0_domain }}
            VITE_AUTH0_CLIENT_ID=${{ steps.config.outputs.auth0_client_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run -d --name smoke --read-only --tmpfs /tmp -p 8080:8080 "boxlead-front:${GITHUB_SHA}"
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz > /dev/null
          curl -fsS http://localhost:8080/app/inbox | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/privacidad | grep -q '<h1'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/no-existe)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/privacidad/)" = "301"
          docker rm -f smoke

      - name: Export static files
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: export
          push: false
          outputs: type=local,dest=dist
          build-args: |
            VITE_API_BASE_URL=${{ steps.config.outputs.api_base_url }}
            VITE_AGENT_API_BASE_URL=${{ steps.config.outputs.agent_api_base_url }}
            VITE_AUTH0_DOMAIN=${{ steps.config.outputs.auth0_domain }}
            VITE_AUTH0_CLIENT_ID=${{ steps.config.outputs.auth0_client_id }}
          cache-from: type=gha

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  deploy:
    name: Deploy to S3 and invalidate CloudFront
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync to S3 and invalidate CloudFront
        run: |
          set -euo pipefail
          PREFIX="${SIGNAL_FRONT_SSM_PREFIX}"
          BUCKET=$(aws ssm get-parameter --name "${PREFIX}S3_BUCKET_NAME" --query Parameter.Value --output text)
          DIST_ID=$(aws ssm get-parameter --name "${PREFIX}CLOUDFRONT_DISTRIBUTION_ID" --query Parameter.Value --output text)
          aws s3 sync dist/assets/ "s3://$BUCKET/assets/" --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ "s3://$BUCKET" --delete --exclude "assets/*" --exclude "*.html" --exclude "*.xml" --exclude "*.txt" --cache-control "public, max-age=86400"
          aws s3 sync dist/ "s3://$BUCKET" --exclude "*" --include "*.html" --include "*.xml" --include "*.txt" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
